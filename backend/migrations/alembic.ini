# Alembic configuration for the Bayora controller store.
#
# The database URL is NOT set here. `env.py` reads it from the application
# settings (get_settings().database_url) so that a single source of truth
# drives both the app and the migrations. `sqlalchemy.url` is left empty on
# purpose: if it were set here it could silently disagree with the runtime
# configuration and migrate the wrong database.
#
# Usage (from the `backend` directory):
#     alembic -c migrations/alembic.ini upgrade head
#     alembic -c migrations/alembic.ini revision --autogenerate -m "..."
#     alembic -c migrations/alembic.ini downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally empty; env.py supplies it.
sqlalchemy.url =

# The file is used for logging configuration only.
[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
